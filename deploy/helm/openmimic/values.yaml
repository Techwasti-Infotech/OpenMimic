coordinator:
  replicaCount: 1
  image:
    repository: ghcr.io/techwasti/openmimic-engine
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    httpPort: 8080
    grpcPort: 50051
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 256Mi

worker:
  replicaCount: 3
  image:
    repository: ghcr.io/techwasti/openmimic-engine
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    limits:
      cpu: 2000m
      memory: 2048Mi
    requests:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75

studio:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/techwasti/openmimic-studio
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: LoadBalancer
    port: 80
