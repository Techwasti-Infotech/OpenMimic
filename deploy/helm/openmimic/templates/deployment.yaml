apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openmimic.fullname" . }}-coordinator
  labels:
    app.kubernetes.io/component: coordinator
    {{- include "openmimic.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.coordinator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: coordinator
      {{- include "openmimic.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: coordinator
        {{- include "openmimic.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: coordinator
          image: "{{ .Values.coordinator.image.repository }}:{{ .Values.coordinator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.coordinator.image.pullPolicy }}
          command: ["mimic"]
          args: ["--mode=coordinator", "--http-port=8080", "--grpc-port=50051"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.coordinator.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openmimic.fullname" . }}-coordinator
  labels:
    app.kubernetes.io/component: coordinator
    {{- include "openmimic.labels" . | nindent 4 }}
spec:
  type: {{ .Values.coordinator.service.type }}
  ports:
    - port: {{ .Values.coordinator.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.coordinator.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    app.kubernetes.io/component: coordinator
    {{- include "openmimic.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openmimic.fullname" . }}-worker
  labels:
    app.kubernetes.io/component: worker
    {{- include "openmimic.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
      {{- include "openmimic.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
        {{- include "openmimic.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: ["mimic-cli"]
          args:
            - "cluster"
            - "--coordinator={{ include "openmimic.fullname" . }}-coordinator:50051"
            - "--workers={{ .Values.worker.replicaCount }}"
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}

