apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: openmimicgenerators.openmimic.org
spec:
  group: openmimic.org
  names:
    kind: OpenMimicGenerator
    listKind: OpenMimicGeneratorList
    plural: openmimicgenerators
    singular: openmimicgenerator
    shortNames:
      - omg
      - mimicgen
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - configMapRef
              properties:
                configMapRef:
                  type: string
                  description: "Name of the ConfigMap containing the mimic.json generator configuration"
                replicas:
                  type: integer
                  default: 1
                rateLimitPerSecond:
                  type: integer
                  description: "Override streaming rate limit"
                sinkOverride:
                  type: object
                  properties:
                    kafkaBrokers:
                      type: array
                      items:
                        type: string
                    kafkaTopic:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                eventsGenerated:
                  type: integer
                activeWorkers:
                  type: integer
      subresources:
        status: {}
