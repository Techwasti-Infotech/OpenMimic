<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090c10"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0e131a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="720" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

  <!-- Top AppShell Header -->
  <rect x="0" y="0" width="1200" height="60" rx="12" fill="url(#headerGrad)"/>
  <rect x="0" y="59" width="1200" height="1" fill="#30363d"/>

  <!-- Logo & Title -->
  <g transform="translate(24, 15)">
    <rect width="30" height="30" rx="6" fill="#0369a1"/>
    <path d="M6 22 L6 10 L15 17 L24 10 L24 22" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="700" font-size="18" fill="#f0f6fc">OpenMimic</text>
    <rect x="145" y="4" width="56" height="20" rx="10" fill="#0284c7" fill-opacity="0.2"/>
    <text x="156" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Studio</text>
  </g>

  <!-- Top Right Engine & SSO Status Badges -->
  <g transform="translate(850, 16)">
    <!-- SSO Badge -->
    <rect x="0" y="2" width="140" height="24" rx="12" fill="#7c3aed" fill-opacity="0.2" stroke="#a78bfa" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#a78bfa"/>
    <text x="26" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#c4b5fd">Okta SSO (Admin)</text>

    <!-- Engine Status Badge -->
    <rect x="155" y="2" width="165" height="24" rx="12" fill="#059669" fill-opacity="0.2" stroke="#34d399" stroke-width="1"/>
    <circle cx="169" cy="14" r="4" fill="#34d399" filter="url(#glow)"/>
    <text x="181" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#6ee7b7">Engine: RUNNING (50k/s)</text>
  </g>

  <!-- Left Sidebar Navigation -->
  <rect x="0" y="60" width="240" height="660" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Nav Items -->
  <g transform="translate(16, 75)" font-family="sans-serif" font-size="13" font-weight="500">
    <!-- Active Tab: Generator Designer -->
    <rect x="0" y="0" width="208" height="36" rx="6" fill="#1f2937" stroke="#38bdf8" stroke-width="1"/>
    <text x="36" y="23" fill="#38bdf8" font-weight="600">Generator Designer</text>
    <circle cx="20" cy="18" r="5" fill="#38bdf8"/>

    <!-- Nav 2: AI Copilot -->
    <rect x="0" y="44" width="208" height="36" rx="6" fill="transparent"/>
    <text x="36" y="67" fill="#8b949e">Mimic Copilot (AI)</text>
    <circle cx="20" cy="62" r="5" fill="#8b949e"/>

    <!-- Nav 3: Constraints & Solvers -->
    <text x="36" y="111" fill="#8b949e">Constraints &amp; Solvers</text>
    <circle cx="20" cy="106" r="5" fill="#8b949e"/>

    <!-- Nav 4: Statistical Fidelity -->
    <text x="36" y="155" fill="#8b949e">Quality &amp; Fidelity (KS)</text>
    <circle cx="20" cy="150" r="5" fill="#8b949e"/>

    <!-- Nav 5: PII Privacy Scanner -->
    <text x="36" y="199" fill="#8b949e">Privacy &amp; PII Scanner</text>
    <circle cx="20" cy="194" r="5" fill="#8b949e"/>

    <!-- Nav 6: MCP Server & LLM Integration -->
    <rect x="0" y="220" width="208" height="36" rx="6" fill="#1e1b4b" fill-opacity="0.6" stroke="#818cf8" stroke-width="1"/>
    <text x="36" y="243" fill="#a5b4fc" font-weight="600">MCP Server (LLM)</text>
    <circle cx="20" cy="238" r="5" fill="#818cf8" filter="url(#glow)"/>

    <!-- Nav 7: Templates Library -->
    <text x="36" y="287" fill="#8b949e">Starter Templates</text>
    <circle cx="20" cy="282" r="5" fill="#8b949e"/>

    <!-- Nav 8: Stream Topology & DAG -->
    <text x="36" y="331" fill="#8b949e">DAG Topology Canvas</text>
    <circle cx="20" cy="326" r="5" fill="#8b949e"/>

    <!-- Nav 9: Live Observability -->
    <text x="36" y="375" fill="#8b949e">Live Observability</text>
    <circle cx="20" cy="370" r="5" fill="#8b949e"/>
  </g>

  <!-- Main Content Area: Studio Designer Canvas -->
  <g transform="translate(260, 80)">
    
    <!-- Top Action Bar -->
    <rect x="0" y="0" width="915" height="60" rx="8" fill="url(#cardGrad)" stroke="#30363d"/>
    <text x="20" y="26" font-family="sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">Production Orders Stream</text>
    <text x="20" y="46" font-family="monospace" font-size="12" fill="#8b949e">Sink: Kafka [orders.payments.v1]  •  Rate: 1,500 evt/s  •  ACID Parquet Rollover: 60s</text>

    <!-- Control Buttons -->
    <g transform="translate(620, 14)">
      <rect x="0" y="0" width="130" height="32" rx="6" fill="#2563eb"/>
      <text x="25" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#fff">▶ Start Engine</text>

      <rect x="140" y="0" width="140" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="156" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🔍 Live Preview (10)</text>
    </g>

    <!-- Schema Fields Card Table -->
    <rect x="0" y="80" width="540" height="520" rx="8" fill="url(#cardGrad)" stroke="#30363d"/>
    <text x="20" y="112" font-family="sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">Configured Generator Fields</text>
    <rect x="420" y="94" width="100" height="26" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="435" y="111" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8">+ Add Field</text>

    <!-- Fields Table Headers -->
    <rect x="20" y="130" width="500" height="30" fill="#161b22" rx="4"/>
    <text x="32" y="150" font-family="sans-serif" font-size="11" font-weight="600" fill="#8b949e">FIELD NAME</text>
    <text x="180" y="150" font-family="sans-serif" font-size="11" font-weight="600" fill="#8b949e">GENERATOR TYPE</text>
    <text x="340" y="150" font-family="sans-serif" font-size="11" font-weight="600" fill="#8b949e">PARAMETERS</text>

    <!-- Row 1: order_id -->
    <line x1="20" y1="195" x2="520" y2="195" stroke="#21262d"/>
    <text x="32" y="185" font-family="monospace" font-size="12" font-weight="600" fill="#f0f6fc">order_id</text>
    <rect x="180" y="170" width="80" height="20" rx="4" fill="#3b82f6" fill-opacity="0.15"/>
    <text x="192" y="184" font-family="sans-serif" font-size="11" fill="#60a5fa">UUID v4</text>
    <text x="340" y="184" font-family="monospace" font-size="11" fill="#8b949e">deterministic</text>

    <!-- Row 2: customer_id -->
    <line x1="20" y1="235" x2="520" y2="235" stroke="#21262d"/>
    <text x="32" y="225" font-family="monospace" font-size="12" font-weight="600" fill="#f0f6fc">customer_id</text>
    <rect x="180" y="210" width="95" height="20" rx="4" fill="#10b981" fill-opacity="0.15"/>
    <text x="190" y="224" font-family="sans-serif" font-size="11" fill="#34d399">Entity Pool</text>
    <text x="340" y="224" font-family="monospace" font-size="11" fill="#8b949e">prefix: usr_, pool: 500</text>

    <!-- Row 3: amount -->
    <line x1="20" y1="275" x2="520" y2="275" stroke="#21262d"/>
    <text x="32" y="265" font-family="monospace" font-size="12" font-weight="600" fill="#f0f6fc">amount</text>
    <rect x="180" y="250" width="105" height="20" rx="4" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="188" y="264" font-family="sans-serif" font-size="11" fill="#fbbf24">Normal Dist</text>
    <text x="340" y="264" font-family="monospace" font-size="11" fill="#8b949e">μ=125.0, σ=45.0</text>

    <!-- Row 4: state -->
    <line x1="20" y1="315" x2="520" y2="315" stroke="#21262d"/>
    <text x="32" y="305" font-family="monospace" font-size="12" font-weight="600" fill="#f0f6fc">status</text>
    <rect x="180" y="290" width="115" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.15"/>
    <text x="188" y="304" font-family="sans-serif" font-size="11" fill="#c084fc">Markov Chain</text>
    <text x="340" y="304" font-family="monospace" font-size="11" fill="#8b949e">funnel: INIT→DONE</text>

    <!-- Row 5: timestamp -->
    <text x="32" y="345" font-family="monospace" font-size="12" font-weight="600" fill="#f0f6fc">created_at</text>
    <rect x="180" y="330" width="70" height="20" rx="4" fill="#06b6d4" fill-opacity="0.15"/>
    <text x="192" y="344" font-family="sans-serif" font-size="11" fill="#22d3ee">Now()</text>
    <text x="340" y="344" font-family="monospace" font-size="11" fill="#8b949e">RFC3339 (epoch)</text>

    <!-- Right Side: Live Streaming Output & Metrics Cards -->
    <g transform="translate(560, 80)">
      <!-- Card 1: Observability Waveform -->
      <rect x="0" y="0" width="355" height="200" rx="8" fill="url(#cardGrad)" stroke="#30363d"/>
      <text x="20" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">Real-time Throughput (Events/sec)</text>
      <text x="20" y="52" font-family="sans-serif" font-size="24" font-weight="800" fill="#38bdf8">48,720 <tspan font-size="13" font-weight="500" fill="#8b949e">p99: 1.2ms</tspan></text>
      
      <!-- Waveform chart path -->
      <path d="M20 160 Q 60 90, 100 130 T 180 80 T 260 110 T 335 70" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
      <path d="M20 160 Q 60 90, 100 130 T 180 80 T 260 110 T 335 70 L 335 180 L 20 180 Z" fill="#38bdf8" fill-opacity="0.08"/>

      <!-- Card 2: Live Stream Output JSON -->
      <rect x="0" y="220" width="355" height="300" rx="8" fill="#090c10" stroke="#30363d"/>
      <rect x="0" y="220" width="355" height="32" rx="8" fill="#161b22"/>
      <text x="16" y="242" font-family="sans-serif" font-size="12" font-weight="600" fill="#f0f6fc">● Live NDJSON Output Stream</text>

      <g transform="translate(16, 275)" font-family="monospace" font-size="11">
        <text y="0" fill="#8b949e">// Kafka [orders.payments.v1]</text>
        <text y="20" fill="#f0f6fc">{</text>
        <text y="38" fill="#79c0ff">  "order_id": <tspan fill="#a5d6ff">"d106520e-a871-47b1..."</tspan>,</text>
        <text y="56" fill="#79c0ff">  "customer_id": <tspan fill="#a5d6ff">"usr_00284"</tspan>,</text>
        <text y="74" fill="#79c0ff">  "amount": <tspan fill="#ff7b72">142.85</tspan>,</text>
        <text y="92" fill="#79c0ff">  "status": <tspan fill="#a5d6ff">"COMPLETED"</tspan>,</text>
        <text y="110" fill="#79c0ff">  "created_at": <tspan fill="#a5d6ff">"2026-11-21T09:30:00Z"</tspan></text>
        <text y="128" fill="#f0f6fc">}</text>

        <text y="160" fill="#8b949e">// Kafka [orders.payments.v1]</text>
        <text y="180" fill="#f0f6fc">{</text>
        <text y="198" fill="#79c0ff">  "order_id": <tspan fill="#a5d6ff">"32686f18-6ffa-48a2..."</tspan>,</text>
        <text y="216" fill="#79c0ff">  "customer_id": <tspan fill="#a5d6ff">"usr_00019"</tspan></text>
      </g>
    </g>
  </g>
</svg>
