<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600">
  <defs>
    <linearGradient id="mcpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="claudeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="mimicGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="glowMcp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1100" height="600" rx="12" fill="url(#mcpBg)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="50" y="55" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="700" font-size="22" fill="#f8fafc">Model Context Protocol (MCP) Architecture</text>
  <text x="50" y="82" font-family="sans-serif" font-size="14" fill="#94a3b8">Autonomous AI Agent Interaction with OpenMimic Synthetic Streaming Engine</text>

  <!-- Left: LLM Clients -->
  <g transform="translate(50, 120)">
    <rect width="280" height="420" rx="10" fill="#1e293b" stroke="#475569"/>
    <rect width="280" height="44" rx="10" fill="#334155"/>
    <text x="20" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">🤖 AI Agents &amp; LLM Clients</text>

    <!-- Client Cards -->
    <g transform="translate(15, 65)">
      <!-- Claude Desktop -->
      <rect width="250" height="65" rx="8" fill="#0f172a" stroke="#d97706"/>
      <text x="15" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#fde68a">Claude Desktop</text>
      <text x="15" y="48" font-family="monospace" font-size="11" fill="#94a3b8">claude_desktop_config.json</text>

      <!-- Cursor IDE -->
      <rect y="80" width="250" height="65" rx="8" fill="#0f172a" stroke="#38bdf8"/>
      <text x="15" y="108" font-family="sans-serif" font-size="13" font-weight="700" fill="#bae6fd">Cursor IDE</text>
      <text x="15" y="128" font-family="monospace" font-size="11" fill="#94a3b8">Settings → Features → MCP</text>

      <!-- Antigravity / Custom Agent -->
      <rect y="160" width="250" height="65" rx="8" fill="#0f172a" stroke="#a855f7"/>
      <text x="15" y="188" font-family="sans-serif" font-size="13" font-weight="700" fill="#e9d5ff">Antigravity / Agentic LLMs</text>
      <text x="15" y="208" font-family="monospace" font-size="11" fill="#94a3b8">Autonomous tool invocations</text>

      <!-- Docker Container -->
      <rect y="240" width="250" height="85" rx="8" fill="#0f172a" stroke="#10b981"/>
      <text x="15" y="266" font-family="sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">Docker Container (GHCR)</text>
      <text x="15" y="286" font-family="monospace" font-size="10" fill="#6ee7b7">ghcr.io/techwasti-infotech/</text>
      <text x="15" y="302" font-family="monospace" font-size="10" fill="#6ee7b7">openmimic/mcp:latest</text>
    </g>
  </g>

  <!-- Center: Protocol Bus -->
  <g transform="translate(360, 260)">
    <!-- Arrows -->
    <line x1="0" y1="40" x2="100" y2="40" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 4"/>
    <polygon points="105,40 92,34 92,46" fill="#38bdf8"/>

    <line x1="105" y1="80" x2="5" y2="80" stroke="#34d399" stroke-width="4" stroke-dasharray="6 4"/>
    <polygon points="0,80 13,74 13,86" fill="#34d399"/>

    <rect x="0" y="100" width="110" height="40" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="12" y="125" font-family="monospace" font-size="11" font-weight="600" fill="#93c5fd">JSON-RPC 2.0</text>
  </g>

  <!-- Right: OpenMimic MCP Engine Server -->
  <g transform="translate(500, 120)">
    <rect width="550" height="420" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <rect width="550" height="44" rx="10" fill="url(#mimicGrad)"/>
    <text x="24" y="28" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">⚡ OpenMimic Native MCP Server (Go Engine)</text>

    <!-- Tools Box -->
    <g transform="translate(20, 65)">
      <rect width="510" height="180" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="16" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">🛠️ In-Process Tool Handlers</text>

      <g transform="translate(16, 45)" font-family="monospace" font-size="11">
        <text y="0" fill="#f8fafc">• <tspan fill="#67e8f9" font-weight="600">openmimic_generate_preview</tspan> : Generates NDJSON events in-process</text>
        <text y="24" fill="#f8fafc">• <tspan fill="#67e8f9" font-weight="600">openmimic_validate_schema</tspan> : Verifies constraints and predicate feasibility</text>
        <text y="48" fill="#f8fafc">• <tspan fill="#67e8f9" font-weight="600">openmimic_sql_to_schema</tspan> : Ingests DDL and produces GeneratorConfig</text>
        <text y="72" fill="#f8fafc">• <tspan fill="#67e8f9" font-weight="600">openmimic_profile_sample_data</tspan> : Infers distributions from raw samples</text>
        <text y="96" fill="#f8fafc">• <tspan fill="#67e8f9" font-weight="600">openmimic_get_template</tspan> : Ecommerce, IoT, fraud, and user funnels</text>
        <text y="120" fill="#f8fafc">• <tspan fill="#67e8f9" font-weight="600">openmimic_list_templates</tspan> : Starter template registry lookup</text>
      </g>
    </g>

    <!-- Resources & Sinks Box -->
    <g transform="translate(20, 260)">
      <rect width="510" height="135" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="16" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">📦 Real-time Resources &amp; Sinks</text>

      <g transform="translate(16, 45)" font-family="sans-serif" font-size="11">
        <text y="0" fill="#94a3b8">Resource URIs: <tspan fill="#86efac" font-family="monospace">mimic://templates/*</tspan>  •  <tspan fill="#86efac" font-family="monospace">mimic://engine/status</tspan></text>
        <text y="24" fill="#94a3b8">Connected Sinks: Kafka, Postgres, S3, Iceberg V2, Delta Lake, ClickHouse, Redis</text>
        <text y="48" fill="#94a3b8">Throughput Performance: &gt; 50,000 events/sec  •  p99 latency &lt; 1.5ms</text>
        <text y="70" fill="#cbd5e1" font-weight="600">100% Free &amp; Open Source under Apache 2.0 License</text>
      </g>
    </g>
  </g>
</svg>
