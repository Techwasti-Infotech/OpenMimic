name: Feature Request
description: Suggest an idea or request a new capability for OpenMimic
title: "[FEATURE]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please describe your use case and how this helps the data engineering community.
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - New Streaming Sink (e.g. ClickHouse, Iceberg, Snowflake)
        - New Generator Function / Distribution
        - Traffic Shaping / Load Simulation
        - Studio UI / Visualization
        - Copilot AI Prompt Capabilities
        - CLI / Automation / Deployment
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the limitation is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: Detailed explanation of how you envision the feature working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or workarounds you currently use.

