name: Release OpenMimic Binaries & Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-package-binaries:
    name: Build & Package Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.26'

      - name: Build mimic server binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p bin
          cd engine
          go build -ldflags="-s -w" -o ../bin/mimic-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/mimic

      - name: Build mimic-cli binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p bin
          cd engine
          go build -ldflags="-s -w" -o ../bin/mimic-cli-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/mimic-cli

      - name: Build mimic-mcp binary (Model Context Protocol Server)
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p bin
          cd engine
          go build -ldflags="-s -w" -o ../bin/mimic-mcp-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/mimic-mcp

      - name: Upload Binary Artifacts for Download
        uses: actions/upload-artifact@v4
        with:
          name: openmimic-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/*
          retention-days: 30

  build-and-push-docker:
    name: Build & Publish Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute Lowercase Repository Name
        id: repo
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lc=${REPO_LC}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. OpenMimic Engine
      - name: Build and push OpenMimic Engine
        uses: docker/build-push-action@v5
        with:
          context: ./engine
          file: ./engine/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo_lc }}/engine:latest
            ghcr.io/${{ steps.repo.outputs.repo_lc }}/engine:${{ github.sha }}

      # 2. OpenMimic MCP Server
      - name: Build and push OpenMimic MCP Server
        uses: docker/build-push-action@v5
        with:
          context: ./engine
          file: ./engine/Dockerfile.mcp
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo_lc }}/mcp:latest
            ghcr.io/${{ steps.repo.outputs.repo_lc }}/mcp:${{ github.sha }}

      # 3. Export MCP Docker image artifact as downloadable tarball
      - name: Build and save local MCP Docker image archive
        run: |
          docker build -t openmimic-mcp:latest -f ./engine/Dockerfile.mcp ./engine
          mkdir -p docker-artifacts
          docker save openmimic-mcp:latest | gzip > docker-artifacts/openmimic-mcp-docker.tar.gz

      - name: Upload MCP Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmimic-mcp-docker-image
          path: docker-artifacts/openmimic-mcp-docker.tar.gz
          retention-days: 30

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-and-package-binaries, build-and-push-docker]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
