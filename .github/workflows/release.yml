name: Release OpenMimic Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build mimic server binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          cd engine
          go build -ldflags="-s -w" -o ../bin/mimic-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/mimic

      - name: Build mimic-cli binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          cd engine
          go build -ldflags="-s -w" -o ../bin/mimic-cli-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/mimic-cli

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openmimic-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/*

  publish-github-release:
    name: Publish GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false

