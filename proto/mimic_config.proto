syntax = "proto3";

package openmimic.v1;

option go_package = "openmimic/engine/pkg/proto/v1;openmimicv1";

// GeneratorConfig is the top-level configuration for an OpenMimic data generator.
message GeneratorConfig {
  string id = 1;
  string name = 2;
  int64 seed = 3;
  int64 event_limit = 4; // 0 for infinite stream
  int32 rate_limit_per_second = 5; // Rate limit (events per second, 0 = unlimited)
  SinkConfig sink = 6;
  repeated Field fields = 7;
  TrafficProfile traffic_profile = 8; // Advanced traffic shaping (diurnal, poisson, bursts)
  repeated Constraint constraints = 9; // Phase 6: Field and cross-field predicates
  repeated AnomalyPlaybook playbooks = 10; // Phase 10: Anomaly injection playbooks
  CDCEnvelope cdc_envelope = 11; // CDC (Change Data Capture) configuration (Debezium envelope)
  DLQConfig dlq = 12; // Dead Letter Queue configuration for quarantined failures
  OTelTracingConfig otel = 13; // OpenTelemetry trace header injection
  SchemaEvolutionConfig schema_evolution = 14; // Mid-stream schema evolution / drift
  LogReplayerConfig log_replayer = 15; // Historical log file replay with time inflation
  ChaosConfig chaos = 16; // Dynamic chaos, latency injection, and broker backpressure
  reserved 17 to 20; // Reserved slots for Phase 8-9 (PII rules, fidelity thresholds, audit tags)
}

// ChaosConfig simulates real-world infrastructure failures and latency spikes
message ChaosConfig {
  bool enabled = 1;
  double failure_rate = 2; // e.g. 0.05 for 5% socket drops / write failures
  int32 min_latency_ms = 3; // e.g. 10ms
  int32 max_latency_ms = 4; // e.g. 500ms
  bool simulate_backpressure = 5; // Simulates slow broker / thread pool starvation
}

// DLQConfig configures quarantine destinations for events failing constraints or validation
message DLQConfig {
  bool enabled = 1;
  string target_topic_or_table = 2; // e.g. "orders.dlq" or "quarantine_events"
  bool include_error_stack = 3;
  bool drop_on_overflow = 4;
}

// OTelTracingConfig configures OpenTelemetry W3C traceparent headers
message OTelTracingConfig {
  bool enabled = 1;
  string service_name = 2; // e.g. "openmimic-producer"
  double sample_rate = 3;  // e.g. 1.0 = 100% trace injection
}

// CDCEnvelope configures Debezium-compatible Change Data Capture payload wrapping
message CDCEnvelope {
  bool enabled = 1;
  string connector_type = 2; // e.g. "postgres", "mysql", "mongodb"
  string database_name = 3;
  string schema_name = 4;
  string table_name = 5;
  double insert_ratio = 6; // e.g. 0.70 (70% create 'c')
  double update_ratio = 7; // e.g. 0.25 (25% update 'u')
  double delete_ratio = 8; // e.g. 0.05 (5% delete 'd')
}

// Constraint definition for predicate evaluation and filtering (Phase 6)
message Constraint {
  string id = 1;
  string name = 2;
  string expression = 3; // e.g. "amount > 50000 && fraud_flag == 1"
  int32 max_resample_retries = 4; // Default 100
  reserved 5 to 10;
}

// AnomalyPlaybook definition (Phase 10)
message AnomalyPlaybook {
  string name = 1;
  double anomaly_rate = 2; // e.g. 0.05 for 5% anomalies
  string injection_type = 3; // "corrupt_payload", "timeout", "null_field", "burst"
  reserved 4 to 10;
}

// Phase 9: Multi-tenancy, Workspaces, Settings & Governance
message GlobalSettings {
  string environment = 1; // "development", "staging", "production"
  int32 max_events_per_generator_cap = 2; // e.g. 1,000,000 (Super Admin enforced hard ceiling)
  int32 max_rate_limit_per_second_cap = 3; // e.g. 5,000 evt/s
  bool enforce_pii_masking = 4; // True to reject unmasked PII
  repeated string allowed_sinks = 5; // e.g. ["kafka", "postgres", "redis", "clickhouse", "stdout"]
  string default_kafka_cluster = 6;
  string audit_retention_days = 7;
}

message TenantSettings {
  string tenant_id = 1;
  string tenant_name = 2;
  int32 default_event_limit = 3; // Convention default: e.g. 1,000
  int32 default_rate_limit = 4;  // Convention default: e.g. 25 eps
  string default_topic_prefix = 5; // Convention: e.g. "tenant.production."
  string default_postgres_schema = 6; // Convention: e.g. "mimic_data"
  bool auto_inject_timestamps = 7; // Convention: auto-add "created_at" if missing
  bool auto_inject_event_id = 8;    // Convention: auto-add UUID "id" if missing
  string default_currency = 9;      // e.g. "USD"
  string default_timezone = 10;     // e.g. "UTC"
  repeated string custom_entity_pools = 11;
}

message Workspace {
  string id = 1;
  string name = 2;
  string owner_id = 3;
  repeated string member_ids = 4;
  string tenant_id = 5;
}

message Template {
  string id = 1;
  string title = 2;
  string category = 3; // e.g. "finance", "ecommerce", "iot"
  GeneratorConfig config = 4;
}

message AuditEvent {
  string id = 1;
  string user_id = 2;
  string action = 3; // "START_GENERATOR", "STOP_GENERATOR", "UPDATE_CONFIG"
  string generator_id = 4;
  int64 timestamp_ms = 5;
  string details = 6;
}

// MultiGeneratorTopology defines correlated multi-stream orchestration (Point 4)
message TopologyNode {
  string generator_id = 1;
  GeneratorConfig config = 2;
  repeated string depends_on = 3; // IDs of generators that must run or emit entities first
  int64 delay_after_parent_ms = 4;
}

message MultiGeneratorTopology {
  string id = 1;
  string name = 2;
  repeated TopologyNode nodes = 3;
}

// TrafficProfile shapes production rate dynamics
message TrafficProfile {
  oneof profile_type {
    ConstantRate constant = 1;
    DiurnalRate diurnal = 2;     // Sine/cosine wave day-night cycles
    PoissonArrival poisson = 3;  // Stochastic inter-arrival times
    BurstSpikeRate burst = 4;    // Periodic traffic spikes (e.g. flash sales)
    BlackFridayFlashCrowd flash_crowd = 5; // Multi-stage Black Friday / Cyber Monday surge
  }
}

message BlackFridayFlashCrowd {
  int32 baseline_rate = 1;     // Normal cruising rate (e.g. 50 eps)
  int32 surge_peak_rate = 2;   // Peak burst during doorbuster (e.g. 5000 eps)
  int32 ramp_up_seconds = 3;   // Seconds to ramp up from baseline to surge
  int32 plateau_seconds = 4;   // Seconds to sustain peak flash traffic
  int32 ramp_down_seconds = 5; // Seconds to return to cruising rate
  double surge_error_rate = 6; // Deliberate failure rate during surge (e.g. 0.08 for 8% timeouts)
}

message ConstantRate {
  int32 rate_per_second = 1;
}

message DiurnalRate {
  int32 base_rate = 1;    // Minimum rate (e.g. night trough)
  int32 peak_rate = 2;    // Maximum rate (e.g. daytime peak)
  int32 period_seconds = 3; // Cycle duration (e.g. 86400s for a day, or 60s for demo)
}

message PoissonArrival {
  double lambda_rate = 1; // Expected average events per second
}

message BurstSpikeRate {
  int32 normal_rate = 1;
  int32 burst_rate = 2;
  int32 interval_seconds = 3;
  int32 duration_seconds = 4;
}

// SinkConfig defines the destination for generated events.
message SinkConfig {
  oneof sink_type {
    KafkaSink kafka = 1;
    PostgresSink postgres = 2;
    S3Sink s3 = 3;
    StdoutSink stdout = 4;
    RedisSink redis = 5;
    ClickHouseSink clickhouse = 6;
    WebhookSink webhook = 7;
    GraphQLSink graphql = 8;
    GrpcStreamSink grpc_stream = 9;
    SnowflakeSink snowflake = 10;
    BigQuerySink bigquery = 11;
  }
}

message SnowflakeSink {
  string account_identifier = 1; // e.g. "xy12345.us-east-1"
  string database = 2;
  string schema = 3;
  string table = 4;
  string pipe_name = 5; // Optional Snowpipe for auto-ingest
  string warehouse = 6;
  int32 batch_size = 7; // Micro-batch size (default: 500)
}

message BigQuerySink {
  string project_id = 1;
  string dataset_id = 2;
  string table_id = 3;
  int32 batch_size = 4; // Streaming buffer batch size (default: 500)
}

message GraphQLSink {
  string endpoint = 1; // e.g. "https://api.example.com/graphql"
  string query_or_mutation = 2; // e.g. "mutation CreateEvent($input: EventInput!) { createEvent(input: $input) { id } }"
  string operation_name = 3;
  map<string, string> headers = 4;
  int32 timeout_ms = 5;
}

message GrpcStreamSink {
  string target = 1; // e.g. "localhost:50051"
  string service_name = 2;
  string method_name = 3;
  bool use_tls = 4;
}

message WebhookSink {
  string endpoint = 1; // e.g. "https://api.example.com/webhooks/events"
  string method = 2; // "POST", "PUT"
  map<string, string> headers = 3;
  int32 timeout_ms = 4;
  int32 retry_attempts = 5;
}

message RedisSink {
  string addr = 1; // e.g. "localhost:6379"
  string password = 2;
  int32 db = 3;
  string key_pattern = 4; // e.g. "mimic:event:{id}" or "stream:orders"
  string mode = 5; // "set", "lpush", "rpush", "publish", "xadd"
  string stream_or_channel = 6; // for pubsub or redis stream
}

message ClickHouseSink {
  string addr = 1; // e.g. "localhost:9000" or "localhost:8123"
  string database = 2;
  string table = 3;
  string username = 4;
  string password = 5;
}

message KafkaSink {
  repeated string brokers = 1;
  string topic = 2;
  string client_id = 3;
  SchemaRegistryConfig schema_registry = 4; // Native Schema Registry & wire format support
  KafkaTransactionalConfig transactional = 5; // Exactly-Once Semantics (EOS) & transactional producers
}

message KafkaTransactionalConfig {
  bool enabled = 1;
  string transactional_id = 2; // e.g. "mimic-tx-producer-01"
  int32 transaction_timeout_ms = 3; // e.g. 60000ms
  int32 batch_commit_size = 4; // Commit transaction every N events (default: 100)
}

message SchemaRegistryConfig {
  bool enabled = 1;
  string url = 2; // e.g. "http://localhost:8081"
  string format = 3; // "avro", "protobuf", "json_schema"
  int32 schema_id = 4; // Explicit ID or 0 for auto-discovered/auto-registered
  string subject = 5; // e.g. "orders-value"
}

message PostgresSink {
  string connection_string = 1;
  string table = 2;
  repeated string columns = 3;
}

message S3Sink {
  string bucket = 1;
  string region = 2;
  string prefix = 3;
  string file_format = 4; // "jsonl", "csv", "parquet"
  string endpoint = 5;    // Optional custom endpoint for MinIO / LocalStack / Cloudflare R2
  int32 max_records_per_file = 6; // Rollover threshold (default: 10,000)
  int32 flush_interval_seconds = 7;
}

message StdoutSink {
  bool pretty = 1;
}

// Field defines a property in generated JSON/record payload.
message Field {
  string name = 1;
  FunctionGenerator generator = 2;
}

// SchemaEvolutionConfig specifies backward/forward schema changes occurring at a given event index
message SchemaEvolutionConfig {
  bool enabled = 1;
  int64 evolve_at_event = 2; // Event threshold when new schema rules kick in
  repeated Field added_fields = 3; // New fields introduced
  repeated string removed_fields = 4; // Deprecated fields removed from payload
}

// LogReplayerConfig specifies ingestion and real-time playback parameters for historical log files
message LogReplayerConfig {
  bool enabled = 1;
  string log_format = 2; // "nginx_combined", "apache_common", "jsonl_audit"
  string file_path = 3;
  double speed_multiplier = 4; // e.g. 1.0 (realtime), 10.0 (10x acceleration)
  bool loop_replay = 5;
}

// FunctionGenerator defines how a field value is generated.
message FunctionGenerator {
  reserved 19 to 20; // Reserved slots
  oneof func {
    UuidFunction uuid = 1;
    DistributionFunction distribution = 2;
    NowFunction now = 3;
    SequentialIntegerFunction sequential_integer = 4;
    StringFakerFunction string_faker = 5;
    ConstantFunction constant = 6;
    WeightedChoiceFunction weighted_choice = 7;
    MarkovChainFunction markov_chain = 8;     // State-machine transitions
    EntityPoolFunction entity_pool = 9;       // Shared relational foreign-key references
    NestedObjectFunction nested_object = 10;  // Multimodal/nested structured JSON
    ArrayFunction array = 11;                 // Repeating arrays of values/objects
    MediaMetaFunction media_meta = 12;        // Audio/image/video synthetic metadata
    DifferentialPrivacyFunction differential_privacy = 13; // Calibrated Laplace or Gaussian noise
    PseudonymizeFunction pseudonymize = 14;   // Format-Preserving Encryption & deterministic hashing
    CalculatedExpressionFunction expression = 15; // In-flight computed formula / CEL expression
    TimeSeriesDriftFunction time_series_drift = 16; // Sinusoidal trends and sensor drift
    SessionWindowFunction session_window = 17;     // Stateful user/device session timeouts
    GeoLocationFunction geo_location = 18;         // Realistic geo coordinates, bounding boxes & country codes
  }
}

// GeoLocationFunction generates correlated latitude, longitude, country, and IP addresses
message GeoLocationFunction {
  string mode = 1; // "coordinates", "country_code", "city", "correlated_ip"
  string region = 2; // "NA" (North America), "EU" (Europe), "APAC" (Asia-Pacific), "GLOBAL"
  double min_latitude = 3;
  double max_latitude = 4;
  double min_longitude = 5;
  double max_longitude = 6;
}

// TimeSeriesDriftFunction simulates seasonal cycles, gradual trend drift, and noise
message TimeSeriesDriftFunction {
  double base_value = 1;
  double trend_slope = 2; // Linear drift per event (e.g. +0.05 per event)
  double seasonality_amplitude = 3; // Sinusoidal amplitude (e.g. 10.0)
  int64 seasonality_period = 4; // Period length in events (e.g. 100 events per cycle)
  double noise_std_dev = 5; // Gaussian jitter
}

// SessionWindowFunction manages stateful session IDs with inactivity expiration
message SessionWindowFunction {
  string user_id_field = 1; // Field to group sessions by
  int64 inactivity_timeout_seconds = 2; // Inactivity cutoff (e.g. 1800s for 30m)
  string session_prefix = 3; // e.g. "sess_"
}

// CalculatedExpressionFunction evaluates mathematical or string expressions
// dynamically referencing other fields in the current event payload.
message CalculatedExpressionFunction {
  string expression = 1; // e.g. "quantity * unit_price * (1.0 - discount)" or "first_name + ' ' + last_name"
  string return_type = 2; // "double", "int64", "string", "bool"
}

// PseudonymizeFunction protects PII while preserving join integrity across tables
message PseudonymizeFunction {
  string method = 1; // "fpe_numeric", "fpe_alphanumeric", "sha256_salt", "mask_chars"
  string salt = 2; // Secret HMAC key or salt
  string source_category = 3; // "credit_card", "ssn", "phone", "email", "ip"
  string mask_format = 4; // e.g. "XXX-XX-####" or "************1234"
}

// DifferentialPrivacyFunction injects calibrated Laplace or Gaussian noise
// into numerical columns to guarantee (epsilon, delta)-differential privacy.
message DifferentialPrivacyFunction {
  string mechanism = 1; // "laplace" or "gaussian"
  double base_value = 2; // base ground-truth mean or central value
  double epsilon = 3; // privacy budget epsilon (> 0)
  double delta = 4; // delta for gaussian mechanism (e.g. 1e-5)
  double sensitivity = 5; // global sensitivity Delta f
  double min_bound = 6; // optional clamp lower bound
  double max_bound = 7; // optional clamp upper bound
}

message NestedObjectFunction {
  repeated Field fields = 1;
}

message ArrayFunction {
  int32 min_items = 1;
  int32 max_items = 2;
  FunctionGenerator item_generator = 3;
}

message MediaMetaFunction {
  string media_type = 1; // "image", "audio", "video"
  string mime_type = 2; // "image/jpeg", "image/png", "audio/mp3", "video/mp4"
  int32 width = 3;
  int32 height = 4;
  int64 max_bytes = 5;
}

message MarkovTransition {
  string to_state = 1;
  double probability = 2;
}

message MarkovState {
  string state_name = 1;
  repeated MarkovTransition transitions = 2;
}

message MarkovChainFunction {
  string initial_state = 1;
  repeated MarkovState states = 2;
}

message EntityPoolFunction {
  string pool_name = 1;      // Identifier for entity pool (e.g. "users", "devices")
  int32 pool_size = 2;       // Maximum distinct entities (e.g. 1000 users)
  string entity_prefix = 3;  // e.g. "usr_"
  RelationalForeignKey foreign_key = 4; // Dynamic relational binding to parent entity stream
}

message RelationalForeignKey {
  string parent_stream_id = 1; // e.g. "users_stream"
  string parent_pool_name = 2; // e.g. "active_users"
  bool allow_orphans = 3;      // false = 100% strict referential integrity
  double orphan_rate = 4;      // e.g. 0.02 for 2% deliberate orphan corruption test
  string cascade_action = 5;   // "cascade", "restrict", "set_null"
}

message UuidFunction {
  bool uppercase = 1;
}

message DistributionFunction {
  oneof distribution_type {
    NormalDistribution normal = 1;
    UniformDistribution uniform = 2;
  }
}

message NormalDistribution {
  double mean = 1;
  double std_dev = 2;
}

message UniformDistribution {
  double min = 1;
  double max = 2;
}

message NowFunction {
  string format = 1; // "RFC3339", "epoch_ms", "epoch_s", or custom layout
}

message SequentialIntegerFunction {
  int64 start = 1;
  int64 step = 2;
}

message StringFakerFunction {
  string category = 1; // "name", "email", "country", "city", "lorem", etc.
  string pattern = 2;  // e.g. "USER_{####}"
}

message ConstantFunction {
  oneof value {
    string string_val = 1;
    int64 int_val = 2;
    double double_val = 3;
    bool bool_val = 4;
  }
}

message WeightedChoiceOption {
  string value = 1;
  double weight = 2;
}

message WeightedChoiceFunction {
  repeated WeightedChoiceOption options = 1;
}

// Engine gRPC Service for generator control and previews
service GeneratorService {
  rpc StartGenerator(StartGeneratorRequest) returns (StartGeneratorResponse);
  rpc StopGenerator(StopGeneratorRequest) returns (StopGeneratorResponse);
  rpc StreamPreview(StreamPreviewRequest) returns (stream StreamPreviewResponse);
  rpc StreamMetrics(StreamMetricsRequest) returns (stream StreamMetricsResponse);

  // Cluster Coordinator RPCs
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc HeartbeatWorker(WorkerHeartbeat) returns (WorkerHeartbeatAck);
  rpc AssignPartitionWork(AssignPartitionWorkRequest) returns (AssignPartitionWorkResponse);
}

message RegisterWorkerRequest {
  string worker_id = 1;
  string hostname = 2;
  int32 cpu_cores = 3;
  int64 available_memory_bytes = 4;
}

message RegisterWorkerResponse {
  bool accepted = 1;
  string cluster_id = 2;
  int32 assigned_worker_index = 3;
}

message WorkerHeartbeat {
  string worker_id = 1;
  int64 events_produced = 2;
  double current_throughput = 3;
  int64 errors = 4;
}

message WorkerHeartbeatAck {
  bool acknowledged = 1;
  bool should_terminate = 2;
}

message AssignPartitionWorkRequest {
  string job_id = 1;
  GeneratorConfig config = 2;
  int64 start_index = 3; // e.g. partition range 0 to 500,000
  int64 end_index = 4;
  int32 target_partition = 5;
}

message AssignPartitionWorkResponse {
  string job_id = 1;
  string status = 2; // "ACCEPTED", "BUSY"
}

message StartGeneratorRequest {
  GeneratorConfig config = 1;
}

message StartGeneratorResponse {
  string generator_id = 1;
  string status = 2;
}

message StopGeneratorRequest {
  string generator_id = 1;
}

message StopGeneratorResponse {
  string generator_id = 1;
  string status = 2;
}

message StreamPreviewRequest {
  GeneratorConfig config = 1;
  int32 preview_count = 2; // Default 10
}

message StreamPreviewResponse {
  int64 index = 1;
  string json_payload = 2;
  int64 timestamp_ms = 3;
}

message StreamMetricsRequest {
  string generator_id = 1;
}

message StreamMetricsResponse {
  string generator_id = 1;
  string status = 2; // "RUNNING", "STOPPED", "FAILED"
  int64 total_events = 3;
  double throughput_events_per_sec = 4;
  int64 total_errors = 5;
  double latency_p99_ms = 6;
  int64 timestamp_ms = 7;
}

