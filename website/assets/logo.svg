<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Emerald Stream Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Core Shield -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2.5" />
  
  <!-- Subtle Internal Grid Lines -->
  <circle cx="60" cy="60" r="42" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 4" fill="none" />

  <!-- Dual Streaming Waveform: The "M" for Mimic & Continuous Pulse -->
  <!-- Left Waveform (Electric Cyan) -->
  <path d="M28 78 L28 42 L44 68 L60 44 L76 68 L92 42 L92 78" 
        stroke="url(#cyanGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)" />

  <!-- Overlapping Synthetic Pulse Beam (Emerald Green) -->
  <path d="M22 60 L38 60 L48 34 L60 84 L72 38 L82 60 L98 60" 
        stroke="url(#emeraldGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Central High-Velocity Pulse Node -->
  <circle cx="60" cy="84" r="5" fill="#38BDF8" filter="url(#neonGlow)" />
  <circle cx="48" cy="34" r="4" fill="#34D399" filter="url(#neonGlow)" />
  <circle cx="72" cy="38" r="4" fill="#38BDF8" filter="url(#neonGlow)" />
</svg>
